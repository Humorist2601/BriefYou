name: "Perf lab"

# A throw-away lab (branch perf-lab only, never in main): builds the Nightly app, starts an
# emulator, puts a big generated database in it, drives the screens and keeps the timings and
# screenshots as a run artifact. Publishes nothing. See perf-lab/README.md.
on:
    push:
        branches:
            - perf-lab
    workflow_dispatch:
        inputs:
            mode:
                description: "scenarios (timings) or readme (clean light and dark screenshots)"
                default: scenarios

jobs:
    lab:
        runs-on: ubuntu-latest
        timeout-minutes: 60
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 17
            - uses: gradle/actions/setup-gradle@v6
            - name: Build the Nightly app (signed with Read You's public test key, never published)
              run: ./gradlew assembleGithubNightly --stacktrace
            - name: Make the test database
              run: python3 perf-lab/make_db.py perf-lab/Reader.db 12000 60
            - name: Allow the emulator to use hardware acceleration
              run: |
                  echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
                  sudo udevadm control --reload-rules
                  sudo udevadm trigger --name-match=kvm
            - name: Run on an emulator
              uses: reactivecircus/android-emulator-runner@v2
              with:
                  api-level: 34
                  arch: x86_64
                  target: google_apis
                  profile: pixel_6
                  disable-animations: false
                  script: env LAB_MODE=${{ inputs.mode }} bash perf-lab/run.sh
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: perf-lab-results
                  path: perf-lab/out/

name: "Build Commit"
on:
    push:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            # Gives every CI build a higher version number so it installs as an update.
            CI_BUILD_NUMBER: ${{ github.run_number }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v4
            - name: Build APK
              run: |
                  set -o pipefail
                  ./gradlew assembleGithubRelease --stacktrace 2>&1 | tee build.log
            - name: Report build errors
              if: failure()
              run: |
                  grep -vE "^> Task|^> Configure" build.log \
                    | grep -E "^e: |error:|What went wrong|Could not|Caused by|^> |FAILURE|resolve" \
                    | head -80 > errors.txt || true
                  msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
                  echo "::error title=Build errors::${msg}"

            - uses: actions/upload-artifact@v4
              with:
                  name: ReadYou-GitHub-Build-${{ github.sha }}
                  path: app/build/outputs/apk/github/release/*.apk

            - name: Publish release
              if: github.ref_type == 'branch'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  apk=$(ls app/build/outputs/apk/github/release/*.apk | head -1)
                  tag="build-${{ github.run_number }}"
                  {
                      echo "Automatic build of \`${{ github.ref_name }}\` at ${GITHUB_SHA::7}."
                      echo
                      echo "### Changes"
                      git log -1 --format='%s%n%n%b' | grep -vE '^(Co-Authored-By|Claude-Session):'
                  } > notes.md
                  gh release create "$tag" "$apk" \
                      --title "Read You+ build ${{ github.run_number }}" \
                      --notes-file notes.md \
                      --target "$GITHUB_SHA" \
                      --latest

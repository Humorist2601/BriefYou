name: "Build Commit"
on:
    push:
    workflow_dispatch:

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v4
            - name: Build APK
              run: |
                  set -o pipefail
                  ./gradlew assembleGithubRelease --stacktrace 2>&1 | tee build.log
            - name: Report build errors
              if: failure()
              run: |
                  grep -E "^e: |error:|What went wrong|Could not|Caused by|> " build.log | head -60 | while IFS= read -r line; do
                      echo "::error::${line//%/%25}"
                  done

            - uses: actions/upload-artifact@v4
              with:
                  name: ReadYou-GitHub-Build-${{ github.sha }}
                  path: app/build/outputs/apk/github/release/*.apk

name: "Sync with Read You"

# Brief You follows Read You: once a day this merges new commits from Ashinch/ReadYou with Brief
# You's main branch, keeping all Brief You changes, and offers the result as a pull request
# ("Read You update"). Nothing reaches main, or a signed release, until you merge that pull
# request yourself. A newer Read You update replaces the open pull request's contents. If the same
# lines were changed on both sides, nothing is changed: the run fails (GitHub emails the owner)
# and lists the conflicting files, and an Issue is opened too when Issues are enabled.

on:
    schedule:
        - cron: "17 3 * * *" # daily, 03:17 UTC
    workflow_dispatch:

env:
    UPSTREAM_REPO: https://github.com/Ashinch/ReadYou.git
    UPSTREAM_BRANCH: main
    BRIEF_BRANCH: main
    # Where the merged update waits for review (builds skip this branch).
    SYNC_BRANCH: read-you-sync

jobs:
    sync:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: write
            pull-requests: write
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ env.BRIEF_BRANCH }}
                  fetch-depth: 0

            - name: Merge Read You into Brief You
              id: merge
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git remote add upstream "$UPSTREAM_REPO"
                  git fetch --no-tags upstream "$UPSTREAM_BRANCH"

                  if git merge-base --is-ancestor "upstream/$UPSTREAM_BRANCH" HEAD; then
                      echo "Already up to date with Read You."
                      echo "result=up-to-date" >> "$GITHUB_OUTPUT"
                      exit 0
                  fi

                  new=$(git log --oneline HEAD.."upstream/$UPSTREAM_BRANCH" | wc -l)
                  if git merge --no-edit -m "Merge Read You ($new new commits) into Brief You" "upstream/$UPSTREAM_BRANCH"; then
                      echo "result=merged" >> "$GITHUB_OUTPUT"
                  else
                      conflicts=$(git diff --name-only --diff-filter=U)
                      git merge --abort
                      echo "result=conflict" >> "$GITHUB_OUTPUT"
                      {
                          echo "Read You has $new new commits that change the same lines as Brief You, so they were not merged automatically. Nothing in Brief You was changed."
                          echo
                          echo "Conflicting files:"
                          echo "$conflicts" | sed 's/^/- `/; s/$/`/'
                          echo
                          echo "Upstream: $UPSTREAM_REPO ($UPSTREAM_BRANCH)"
                      } > body.md
                      cat body.md >> "$GITHUB_STEP_SUMMARY"
                      # Open an Issue when Issues are enabled (best effort).
                      title="Read You update needs a manual merge"
                      if ! gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null | grep -q .; then
                          gh issue create --title "$title" --body-file body.md || true
                      fi
                      echo "::error title=Manual merge needed::Read You changes conflict with Brief You in: $(echo $conflicts)"
                      exit 1
                  fi

            - name: Offer the merge as a pull request
              if: steps.merge.outputs.result == 'merged'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if ! git push --force origin "HEAD:refs/heads/$SYNC_BRANCH"; then
                      # Usually means Read You changed a workflow file, which this token may not push.
                      title="Read You update could not be pushed automatically"
                      if ! gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' 2>/dev/null | grep -q .; then
                          gh issue create --title "$title" --body "The merge with Read You succeeded but could not be pushed (Read You probably changed a file under .github/workflows). It needs to be merged by hand." || true
                      fi
                      echo "::error title=Push failed::The merge with Read You could not be pushed; it needs to be merged by hand."
                      exit 1
                  fi
                  {
                      echo "Read You's latest changes, merged with Brief You. Review them, then merge this pull request to build and release them."
                      echo
                      echo "### New Read You commits"
                      git log --format='- %s (%h)' "origin/$BRIEF_BRANCH..upstream/$UPSTREAM_BRANCH" | head -50
                      echo
                      # Which of Brief You's changes and copies Read You's update touches.
                      python3 .github/fork/fork_check.py report \
                          "$(git merge-base "origin/$BRIEF_BRANCH" "upstream/$UPSTREAM_BRANCH")" \
                          "upstream/$UPSTREAM_BRANCH" || true
                  } > pr.md
                  existing=$(gh pr list --head "$SYNC_BRANCH" --base "$BRIEF_BRANCH" --state open --json number --jq '.[0].number')
                  if [ -n "$existing" ]; then
                      gh pr edit "$existing" --body-file pr.md
                      echo "Updated pull request #$existing" >> "$GITHUB_STEP_SUMMARY"
                  elif ! gh pr create --head "$SYNC_BRANCH" --base "$BRIEF_BRANCH" --title "Read You update" --body-file pr.md; then
                      # Needs Settings → Actions → General → "Allow GitHub Actions to create and approve pull requests".
                      link="https://github.com/${{ github.repository }}/compare/$BRIEF_BRANCH...$SYNC_BRANCH"
                      echo "The update is ready on the \`$SYNC_BRANCH\` branch, but the pull request couldn't be opened automatically. Open it here: $link" >> "$GITHUB_STEP_SUMMARY"
                      echo "::warning title=Open the pull request by hand::$link (or allow GitHub Actions to create pull requests in the repository settings)"
                  fi

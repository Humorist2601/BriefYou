name: "Build"
# Builds main and publishes it as a release. Only main runs this workflow, so its run number (the
# build number and version code) goes up by one per release. Other branches are built by
# test.yaml, which reuses this workflow for Brief You Nightly (its own app, published as the one
# "Nightly" prerelease).
on:
    push:
        branches:
            - main
    workflow_dispatch:
    workflow_call:
        inputs:
            nightly:
                description: "Build Brief You Nightly and publish it as the Nightly prerelease"
                type: boolean
                default: false

env:
    # The build type: release for Brief You, nightly for Brief You Nightly.
    VARIANT: ${{ inputs.nightly && 'nightly' || 'release' }}

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v7
              with:
                  # Full history, to find the newest Read You change included.
                  fetch-depth: 0
            - uses: actions/setup-java@v6
              with:
                  distribution: temurin
                  java-version: 17

            - name: Fork check (warnings only)
              # Every change to a Read You file should be small and marked "Brief You", so Read You
              # updates merge easily (see .github/fork/). Warns, never fails the build.
              continue-on-error: true
              run: |
                  git fetch -q --no-tags https://github.com/Ashinch/ReadYou.git main || exit 0
                  base=$(git merge-base HEAD FETCH_HEAD)
                  if ! python3 .github/fork/fork_check.py check "$base" > fork.txt; then
                      grep '^- ' fork.txt | head -30 | while read -r line; do
                          echo "::warning title=Unmarked change to a Read You file::${line#- }"
                      done
                  fi
                  cat fork.txt >> "$GITHUB_STEP_SUMMARY"

            - name: Set build number
              # This workflow's run number: 1, 2, 3… (it started again at 1 when the workflow
              # was renamed to build.yaml). It's also the app's version code, so each build
              # installs as an update over the one before.
              run: echo "CI_BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

            - name: Use Brief You's signing key
              # With the key in the repo's secrets, builds are signed with it instead of Read
              # You's public key (which anyone could sign an "update" with). The build reads
              # signature/keystore_release.properties first when it exists.
              env:
                  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
                  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
              run: |
                  if [ -z "$KEYSTORE_BASE64" ]; then
                      echo "::warning title=Signing::No KEYSTORE_BASE64 secret: signed with Read You's public key."
                      exit 0
                  fi
                  echo "$KEYSTORE_BASE64" | base64 -d > signature/briefyou-release.jks
                  {
                      echo "storeFile=../signature/briefyou-release.jks"
                      echo "storePassword=$KEYSTORE_PASSWORD"
                      echo "keyPassword=$KEYSTORE_PASSWORD"
                      echo "keyAlias=${KEY_ALIAS:-briefyou}"
                  } > signature/keystore_release.properties

            - uses: gradle/actions/setup-gradle@v6
            - name: Build APK
              run: |
                  set -o pipefail
                  ./gradlew "assembleGithub${VARIANT^}" --stacktrace 2>&1 | tee build.log
            - name: Summarise warnings
              # Kotlin warnings, Brief You's (brief/ and its copies) and Read You's, as a few
              # annotations (readable from the GitHub API) and a table in the summary.
              if: always()
              continue-on-error: true
              run: |
                  grep -E '^w: ' build.log | sed -E "s#file://$GITHUB_WORKSPACE/##; s#^w: ##" | sort -u > warnings.txt || true
                  total=$(wc -l < warnings.txt)
                  brief=$(grep -cE '^app/src/main/java/me/ash/reader/brief/' warnings.txt || true)
                  {
                      echo "### Kotlin warnings"
                      echo
                      echo "- **Brief You's own code: $brief** (should be 0; listed in the annotations)"
                      echo "- Read You's code: $((total - brief)) (left to Read You on purpose: see README, How Brief You is organised)"
                  } >> "$GITHUB_STEP_SUMMARY"
                  # Brief You's own first (these are the ones to fix), then Read You's deprecated
                  # library calls, as annotations readable from the GitHub API.
                  grep -E '^app/src/main/java/me/ash/reader/brief/' warnings.txt > fix.txt || true
                  grep -vE '^app/src/main/java/me/ash/reader/brief/' warnings.txt \
                      | grep 'is deprecated' | grep -v 'type-safe PreferencesKey' >> fix.txt || true
                  split -l 12 -d fix.txt part_ || true
                  n=0
                  for f in part_*; do
                      [ -f "$f" ] || continue
                      n=$((n + 1)); [ $n -gt 9 ] && break
                      msg=$(sed -e 's/%/%25/g' "$f" | awk '{printf "%s%%0A", $0}')
                      echo "::warning title=Kotlin warnings ($n)::${msg}"
                  done

            - name: Report build errors
              if: failure()
              run: |
                  grep -vE "^> Task|^> Configure" build.log \
                    | grep -E "^e: |error:|What went wrong|Could not|Caused by|^> |FAILURE|resolve" \
                    | head -80 > errors.txt || true
                  msg=$(sed -e 's/%/%25/g' errors.txt | awk '{printf "%s%%0A", $0}')
                  echo "::error title=Build errors::${msg}"

            - uses: actions/upload-artifact@v7
              with:
                  name: ReadYou-GitHub-Build-${{ github.sha }}
                  path: app/build/outputs/apk/github/${{ env.VARIANT }}/*.apk

            - name: Publish Nightly
              # Test builds: the one Nightly prerelease, replaced by each one (never "latest").
              if: inputs.nightly
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  apk=$(ls app/build/outputs/apk/github/nightly/*.apk | head -1)
                  readyou=$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
                  {
                      echo "Brief You Nightly: a test build of \`${{ github.ref_name }}\` at ${GITHUB_SHA::7}. It installs next to Brief You, with its own data."
                      echo
                      echo "### Changes"
                      git log -1 --format='%s%n%n%b' | grep -vE '^(Co-Authored-By|Claude-Session):'
                  } > notes.md
                  gh release delete nightly --cleanup-tag --yes 2>/dev/null || true
                  gh release create nightly "$apk" \
                      --title "Brief You Nightly ${readyou}.${CI_BUILD_NUMBER}" \
                      --notes-file notes.md \
                      --target "$GITHUB_SHA" \
                      --prerelease \
                      --latest=false

            - name: Publish release
              # Only main is released.
              if: ${{ !inputs.nightly && github.ref_name == 'main' }}
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  apk=$(ls app/build/outputs/apk/github/release/*.apk | head -1)
                  # Read You's version (from its line in the build file) plus the build number:
                  # 0.16.2.102, the same as the app's version.
                  readyou=$(grep -m1 'versionName = "' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
                  tag="${readyou}.${CI_BUILD_NUMBER}"
                  # The newest Read You change included, and the last check for new ones.
                  included="unknown"
                  if git fetch -q --no-tags https://github.com/Ashinch/ReadYou.git main; then
                      included=$(git log -1 --format=%cd --date=format:'%b %-d, %Y' "$(git merge-base HEAD FETCH_HEAD)")
                  fi
                  checked=$(gh api "repos/${{ github.repository }}/actions/workflows/sync.yaml/runs?status=success&per_page=1" \
                      -q '.workflow_runs[0].updated_at // empty' 2>/dev/null | cut -c1-10 || true)
                  [ -n "$checked" ] && checked=$(date -d "$checked" '+%b %-d, %Y') || checked="never"
                  {
                      echo "Automatic build of \`${{ github.ref_name }}\` at ${GITHUB_SHA::7}."
                      echo
                      echo "Based on **Read You ${readyou}**: includes Read You's changes up to ${included} (last checked for updates ${checked})."
                      echo
                      echo "### Changes"
                      git log -1 --format='%s%n%n%b' | grep -vE '^(Co-Authored-By|Claude-Session):'
                  } > notes.md
                  gh release create "$tag" "$apk" \
                      --title "Brief You ${tag}" \
                      --notes-file notes.md \
                      --target "$GITHUB_SHA" \
                      --latest
